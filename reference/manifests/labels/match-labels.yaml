# Equality-based selector: every label listed must match exactly.
# matchLabels takes single values. To match one of several values, use
# matchExpressions (see LabelExpressions.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
      environment: production
  template:
    metadata:
      labels:
        app: my-app
        environment: production
    spec:
      containers:
        - name: web
          image: nginx:1.27
