# A Job that needs 6 successful runs, at most 2 at a time.
# Indexed completion gives each Pod a number (0-5) in JOB_COMPLETION_INDEX,
# so each one can work on its own slice of the work.
#
#   kubectl apply -f job-parallel.yaml
#   kubectl get pods -l job-name=process-batches -w
#   kubectl logs -l job-name=process-batches --prefix
apiVersion: batch/v1
kind: Job
metadata:
  name: process-batches
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo \"processing batch $JOB_COMPLETION_INDEX\"; sleep 5"]
