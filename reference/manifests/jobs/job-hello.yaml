# The smallest useful Job: run a container once, to completion.
#
#   kubectl apply -f job-hello.yaml
#   kubectl wait --for=condition=Complete job/hello --timeout=60s
#   kubectl logs job/hello
apiVersion: batch/v1
kind: Job
metadata:
  name: hello
spec:
  ttlSecondsAfterFinished: 300   # clean up the finished Job after 5 minutes
  template:
    spec:
      restartPolicy: Never       # Jobs use Never or OnFailure, never Always
      containers:
        - name: hello
          image: busybox:1.36
          command: ["sh", "-c", "echo \"hello from $(hostname)\""]
