# A RoleBinding gives a Role to subjects: users, groups or ServiceAccounts.
#
# Bind groups rather than individual users where you can: people join and
# leave teams, and the identity provider (SSO, IAM) keeps group membership.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: team-a
subjects:
  - kind: Group
    name: team-a-developers      # as reported by your identity provider
    apiGroup: rbac.authorization.k8s.io
  - kind: ServiceAccount
    name: ci-reader              # see service-account.yaml
    namespace: team-a
roleRef:                         # cannot be changed later; delete and recreate instead
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
