# A ServiceAccount is the identity of a workload, such as a CI job or an app
# that calls the Kubernetes API. Pods use it through spec.serviceAccountName.
# Hands-on: labs/10-rbac-least-privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-reader
  namespace: team-a
# Only mount an API token into Pods that actually call the API.
automountServiceAccountToken: false
