apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: customer
  labels:
    app: packersmovers
    tier: backend
spec:
  replicas: 5
  minReadySeconds: 10
  selector:
    matchLabels:
      app: packersmovers
      tier: backend
  template:
    metadata:
      labels:
        app: packersmovers
        tier: backend
    spec:
      containers:
      - name: customer
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/customer:3
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
