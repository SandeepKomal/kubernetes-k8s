name: Something is wrong or unclear
description: An explanation, manifest or command is incorrect, outdated or confusing.
labels: ["docs"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File path or site section.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
