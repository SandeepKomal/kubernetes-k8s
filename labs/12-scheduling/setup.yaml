apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      nodeSelector:
        accelerator: gpu
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "echo training on $(hostname); sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
