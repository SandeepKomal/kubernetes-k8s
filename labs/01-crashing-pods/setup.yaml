apiVersion: v1
kind: Pod
metadata:
  name: menu
  labels:
    app: menu
spec:
  containers:
    - name: menu
      image: ngnix:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: orders
  labels:
    app: orders
spec:
  containers:
    - name: orders
      image: busybox:1.36
      command: ["sh", "-c", "echo 'orders service up'; sleeep 3600"]
