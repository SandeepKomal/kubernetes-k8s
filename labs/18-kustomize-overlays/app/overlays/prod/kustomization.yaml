apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nimbus-18
resources:
  - ../../base
labels:
  - pairs:
      env: prod
    includeTemplates: true
replicas:
  - name: shop
    count: 3
images:
  - name: nginx
    newTag: 1.27-prod
configMapGenerator:
  - name: shop-config
    behavior: merge
    literals:
      - THEME=dark
patches:
  - path: resources.yaml
