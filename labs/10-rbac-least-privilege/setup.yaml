apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auditor
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor
subjects:
  - kind: ServiceAccount
    name: auditor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auditor
