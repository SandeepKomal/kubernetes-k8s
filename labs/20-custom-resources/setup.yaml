apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: menus.kitchen.example.com
spec:
  group: kitchen.example.com
  scope: Namespaced
  names:
    kind: Menu
    singular: menu
    plural: menus
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["price", "items"]
              properties:
                price:
                  type: integer
                  minimum: 1
                  description: Price per person, in whole currency units.
                items:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Dishes on the menu.
