apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-page
data:
  index.html: |
    <!doctype html>
    <title>Kubelet Kitchen</title>
    <h1>Kubelet Kitchen is open</h1>
    <p>Hot food, delivered by containers.</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpne
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: storefront-html
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app: store-front
  ports:
    - port: 80
      targetPort: http
