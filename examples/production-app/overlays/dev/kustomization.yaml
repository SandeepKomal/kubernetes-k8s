apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      environment: dev
    includeTemplates: true
configMapGenerator:
  - name: web-api-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
patches:
  # Development needs one replica at most; keep cost and noise low.
  - target:
      kind: HorizontalPodAutoscaler
      name: web-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: PodDisruptionBudget
      name: web-api
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
