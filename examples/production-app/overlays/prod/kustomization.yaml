apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources:
  - namespace.yaml
  - ../../base
labels:
  - pairs:
      environment: prod
    includeTemplates: true
images:
  # CI updates this line on release, for example:
  #   kustomize edit set image nginxinc/nginx-unprivileged=registry.example.com/web-api:1.4.2
  - name: nginxinc/nginx-unprivileged
    newTag: 1.27-alpine
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: web-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: Deployment
      name: web-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 200m, memory: 256Mi}
          limits: {memory: 256Mi}
