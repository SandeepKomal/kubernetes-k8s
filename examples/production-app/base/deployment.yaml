apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api
spec:
  # No `replicas`: the HorizontalPodAutoscaler owns the count.
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-api
    spec:
      serviceAccountName: web-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # busybox defaults to root; your own image should set a non-root USER.
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web-api
          # Compare only Pods of the same revision, so a rollout cannot pile
          # the new replicas onto one node next to the old ones.
          matchLabelKeys: ["pod-template-hash"]
      containers:
        - name: web-api
          # Replace with your own image. Pin a version or digest, never latest.
          # Stand-in app: busybox's built-in web server on port 8080.
          image: busybox:1.36
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: web-api-config
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Give load balancers time to stop sending traffic before exit.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
            # Most apps need one writable scratch folder when the root
            # filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: web-api-content
        - name: tmp
          emptyDir: {}
