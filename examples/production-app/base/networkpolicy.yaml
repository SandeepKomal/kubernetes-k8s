# Deny all ingress to the app except from Pods labelled as its clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: shop
      ports:
        - protocol: TCP
          port: 8080
