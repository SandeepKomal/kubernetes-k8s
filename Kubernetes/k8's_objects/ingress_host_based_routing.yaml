apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-packersmovers-service
  labels:
    app: packersmovers
  annotations:
    # Ingress Core Settings
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: <SUBNET_ID_1>, <SUBNET_ID_2>, <SUBNET_ID_3>
    alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/healthcheck-path: /health
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<REGION>:<AWS_ACCOUNT_ID>:certificate/<CERTIFICATE_ID>
spec:
  ingressClassName: alb
  rules:
    - host: customer.hpm.in
      http:
        paths:
          - path: /customer*
            pathType: Prefix
            backend:
              service:
                name: customer-service
                port:
                  number: 8081
    - host: driver.hpm.in
      http:
        paths:
          - path: /driver*
            pathType: Prefix
            backend:
              service:
                name: driver-service
                port:
                  number: 8081
