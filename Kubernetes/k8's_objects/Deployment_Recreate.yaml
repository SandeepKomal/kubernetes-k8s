apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  labels:
    app: packersmovers
    tier: backend
spec:
  strategy:
    type: Recreate
  replicas: 4
  selector:
    matchLabels:
      app: packersmovers
  template:
    metadata:
      labels:
        app: packersmovers
        tier: backend
    spec:
      containers:
      - name: customer
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/customer:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
