# Example values only. base64 is an encoding, not encryption: anyone who can
# read this file can decode it. Create real Secrets from a secret manager or
# with `kubectl create secret generic`, never from a file in Git.
#
#   echo -n 'example-client' | base64    -> ZXhhbXBsZS1jbGllbnQ=
apiVersion: v1
kind: Secret
metadata:
  name: customer-secrets
type: Opaque
data:
  client-id: ZXhhbXBsZS1jbGllbnQ=
  api-token: ZXhhbXBsZS10b2tlbg==
  signing-key: ZXhhbXBsZS1zaWduaW5nLWtleQ==
