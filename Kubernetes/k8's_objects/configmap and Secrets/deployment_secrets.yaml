apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  labels:
    app: packersmovers
    tier: backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  revisionHistoryLimit: 4
  replicas: 1
  minReadySeconds: 10
  selector:
    matchLabels:
      app: packersmovers
      tier: backend
  template:
    metadata:
      labels:
        app: packersmovers
        tier: backend
    spec:
      containers:
      - name: customer
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/spring:11
        imagePullPolicy: Always
        env:
        - name: API_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: customer-secrets
              key: client-id
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: customer-secrets
              key: api-token
        - name: SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: customer-secrets
              key: signing-key
        ports:
        - containerPort: 8081
