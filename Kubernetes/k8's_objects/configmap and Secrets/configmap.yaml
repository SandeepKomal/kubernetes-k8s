# Non-secret settings only. The database password belongs in a Secret
# (see secrets.yaml), never in a ConfigMap: anyone who can read ConfigMaps
# could read it.
kind: ConfigMap
apiVersion: v1
metadata:
  name: customer-config-map
  namespace: default
data:
  db-username: "spring"
  db-endpoint: "jdbc:mysql://<RDS_ENDPOINT>:3306/springdb"
