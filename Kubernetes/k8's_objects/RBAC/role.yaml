apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-service-account
  namespace: naveen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: naveen  # Replace 'your-namespace' with your desired namespace
  name: my-role
# Avoid "*" in real clusters: grant only the resources and verbs needed.
# See labs/10-rbac-least-privilege for a hands-on exercise.
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
