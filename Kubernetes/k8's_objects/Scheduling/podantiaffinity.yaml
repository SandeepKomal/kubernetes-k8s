apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      name: todo-api-pod
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: pavanelthepu/todo-api:1.0.2
          ports:
            - containerPort: 8082
          env:
            # Never put connection strings with passwords in a manifest.
            # Create the Secret first:
            #   kubectl create secret generic todo-api-secrets --from-literal=mongodb-uri='mongodb+srv://...'
            - name: "spring.data.mongodb.uri"
              valueFrom:
                secretKeyRef:
                  name: todo-api-secrets
                  key: mongodb-uri
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - "todo-ui"
              topologyKey: kubernetes.io/hostname
