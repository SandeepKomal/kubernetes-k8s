# Node affinity: choose nodes by their labels.
#
# required...  is a hard rule: Pods stay Pending until a node matches.
# preferred... is a soft rule: the scheduler favours matching nodes, by weight,
#              but still places the Pod somewhere else if none match.
#
# Try it:
#   kubectl apply -f nodeaffinity.yaml
#   kubectl get pods -l app=web -o wide          # spread over any Linux node
#   kubectl label node <node> disktype=ssd       # then delete a Pod and watch
#   kubectl delete pod -l app=web                # the new ones prefer that node
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      affinity:
        nodeAffinity:
          # Hard rule: only Linux nodes. Matters in clusters that also run Windows nodes.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values: ["linux"]
          # Soft rules: SSD nodes score 80, nodes of the web team score 20.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: disktype
                    operator: In
                    values: ["ssd"]
            - weight: 20
              preference:
                matchExpressions:
                  - key: team
                    operator: In
                    values: ["web"]
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
