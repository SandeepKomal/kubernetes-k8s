# DaemonSet: one Pod on every node.
#
# Log and metrics agents are the classic use. This one reads the node's
# kernel log through a read-only hostPath volume, and learns which node it is
# on from the downward API. Real clusters run a dedicated agent the same way;
# the DaemonSet patterns are identical.
#
# Try it:
#   kubectl apply -f daemonset.yaml
#   kubectl get pods -l app=node-log-agent -o wide     # one per node
#   kubectl logs -l app=node-log-agent --prefix
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-agent
  labels:
    app: node-log-agent
spec:
  selector:
    matchLabels:
      app: node-log-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: node-log-agent
    spec:
      # Node agents usually run on control-plane nodes too.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "node=$NODE_NAME log files=$(ls /host/var/log | wc -l)"
                sleep 60
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
